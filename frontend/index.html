<body>
  <main>
    <div class="titulo-pagina"><h1>Lixeiras</h1><p>Selecione uma lixeira para consultar os detalhes.</p></div>
      <section class="lista-lixeiras" aria-label="Lixeiras monitoradas">
        <a id="lixeira-01" class="lixeira-card" href="lixeira.html" data-recente="false" data-conhecido="false" data-alerta="false">
          <span class="cabecalho-lixeira"><strong>Lixeira 01</strong><span class="tag-lixeira">Configurada</span></span>
          <svg class="icone-lixeira" viewBox="0 0 140 160" fill="none" aria-hidden="true">
            <defs><clipPath id="corpo-01"><path d="M31 40H109L102 145H38Z"/></clipPath></defs>
            <path class="fundo-lixeira" d="M31 40H109L102 145H38Z"/>
            <rect id="nivel-lixeira" class="nivel-lixeira" x="30" y="145" width="80" height="0" clip-path="url(#corpo-01)"/>
            <path d="M31 40H109L102 145H38L31 40ZM24 33H116V40H24V33ZM55 33V23H85V33M53 57L56 126M70 57V126M87 57L84 126"/>
          </svg>
          <span class="percentual"><span id="porcentagem">—</span><span>%</span></span>
          <span id="estado-cartao" class="estado-cartao" role="status">Aguardando dados</span>
          <span class="abrir-lixeira">Ver detalhes <span aria-hidden="true">↗</span></span>
        </a>
        <button class="lixeira-card lixeira-inativa" type="button" disabled>
          <span class="cabecalho-lixeira"><strong>Lixeira 02</strong><span class="tag-lixeira">Inativa</span></span>

          <span class="estado-cartao">Sem dispositivo conectado</span>
          <span class="abrir-lixeira">Indisponível</span>
        </button>
        <button class="lixeira-card lixeira-inativa" type="button" disabled>
          <span class="cabecalho-lixeira"><strong>Lixeira 03</strong><span class="tag-lixeira">Inativa</span></span>
